<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./static/css/main.css">
    <title>Вход</title>
</head>
<body>
    <main class="login">
        <form class="login-form">
            <div class="login-form__field">
                <p> Вход </p>
                <label class="login-form__label" >E-mail</label>
                <input class="login-form__input" type="email" placeholder="Введите e-mail">
            </div>

            <div class="login-form__field">
                <label class="login-form__label">Пароль</label>
                <input class="login-form__input" type="password" placeholder="Введите пароль">
            </div>

            <a href="index.html"><button class="login-form__button" type="button"> Войти</button></a>
        </form>
    </main>
</body>
</html>
