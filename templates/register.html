<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../static/css/main.css">
    <title>Вход</title>
</head>
<body>
    <main class="login">
        <form class="login-form">
            <div class="login-form__field">
                <p> Регистрация </p>
                <label class="login-form__label">E-mail</label>
                <input class="login-form__input" type="email" placeholder="Е-mail">
            </div>

            <div class="login-form__field">
                <label class="login-form__label">Фамилия</label>
                <input class="login-form__input" type="text" placeholder="Фамилия">
            </div>

            <div class="login-form__field">
                <label class="login-form__label">Имя</label>
                <input class="login-form__input" type="text" placeholder="Имя">
            </div>

            <div class="login-form__field">
                <label class="login-form__label">Дата рождения</label>
                <input class="login-form__input" type="date" placeholder="ДД.ММ.ГГГГ">
            </div>

            <div class="login-form__field">
                <label class="login-form__label">Номер телефона</label>
                <input class="login-form__input" type="tel" placeholder="+7 123 456 78 90">
            </div>

            <div class="login-form__field">
                <label class="login-form__label" for="password">Пароль</label>
                <input class="login-form__input" type="password" placeholder="Пароль">
            </div>

            <div class="login-form__field">
                <label class="login-form__label" for="password">Повтор пароля</label>
                <input class="login-form__input" type="password" placeholder="Пароль">
            </div>
            <div class="login-form__field">
                <input type="checkbox"> Cогласие на обработку персональных данных
            </div>
            <a href="index.html"><button class="login-form__button" type="button"> Зарегистрироваться</button></a>
        </form>
    </main>
</body>
</html>
